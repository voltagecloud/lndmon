name: Voltage release binaries

on:
  push:
    tags:
      - 'voltage-v*'

permissions:
  contents: read

jobs:
  binaries:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build static Linux binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir dist
          go build -trimpath -ldflags='-s -w' -o dist/lndmon-linux-${GOARCH} ./cmd/lndmon
          cd dist
          sha256sum lndmon-linux-${GOARCH} > lndmon-linux-${GOARCH}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lndmon-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
